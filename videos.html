<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Videos - Polinomios</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        .video-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }

        .video-thumb {
            max-width: 480px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

            .video-thumb:hover {
                transform: scale(1.03);
            }

        .video-link {
            text-align: center;
            font-weight: bold;
            margin-top: -15px;
            color: #000;
        }

        iframe {
            border-radius: 12px;
        }

        .volver-btn {
            margin: 40px auto 20px;
            text-align: center;
        }

            .volver-btn a button {
                background-color: #ffd700;
                border: none;
                padding: 10px 20px;
                font-size: 16px;
                border-radius: 10px;
                cursor: pointer;
                transition: background-color 0.3s ease;
            }

                .volver-btn a button:hover {
                    background-color: #e6c200;
                }
    </style>
</head>
<body>
    <header>
        <h1>Videos Educativos sobre Polinomios</h1>
    </header>

    <nav>
        <ul class="navbar">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="teoria.html">Teoría</a></li>
            <li><a href="ejemplos.html">Ejemplos</a></li>
            <li><a href="juegos.html">Juegos</a></li>
            <li><a href="videos.html">Videos</a></li>
        </ul>
    </nav>

    <main class="video-container">
        <!-- Video 1 (se puede insertar) -->
        <iframe width="100%" height="315" src="https://www.youtube.com/embed/vvIYwabU1lw" frameborder="0" allowfullscreen></iframe>

        <!-- Video 2 (no se puede insertar, solo enlace con miniatura) -->
        <a href="https://www.youtube.com/watch?v=9C0qPqSAZZM" target="_blank">
            <img class="video-thumb" src="https://img.youtube.com/vi/9C0qPqSAZZM/hqdefault.jpg" alt="Video Polinomios: explicación visual">
        </a>
        <div class="video-link">🎥 Haz clic en la imagen para ver este video en YouTube</div>

        <!-- Botón para volver al inicio -->
        <div class="volver-btn">
            <a href="index.html"><button>🔙 Volver al INICIO</button></a>
        </div>
    </main>

    <footer>
        © 2025 Unidad Educativa Oxford - Proyecto Didáctico de Matemáticas
    </footer>
</body>
</html>
